name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: careflow
          POSTGRES_DB: careflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careflow -d careflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://careflow:careflow@127.0.0.1:5432/careflow_test
      AUTH_SECRET: ci-auth-secret-with-at-least-32-characters
      AUTH_URL: http://localhost:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_FROM: CareFlow CI <no-reply@careflow.test>
      MAILPIT_URL: http://127.0.0.1:8025
      MFA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      RECOVERY_CODE_PEPPER: ci-recovery-code-pepper-at-least-32-characters
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - run: npm audit --audit-level=high
