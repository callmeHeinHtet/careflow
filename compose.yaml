services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow_dev
      POSTGRES_DB: careflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow -d careflow"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - careflow_postgres:/var/lib/postgresql/data

volumes:
  careflow_postgres:
